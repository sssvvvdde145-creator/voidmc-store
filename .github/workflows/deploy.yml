name: Deploy VOID MC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract website
        run: |
          unzip -o VOID_MC_SHOP_AND_SEPARATE_ADMIN.zip -d extracted

      - name: Configure Worker
        run: |
          sed -i 's/PASTE_YOUR_D1_DATABASE_ID_HERE/fd346acc-2ef1-4104-8d1e-cf44ba8e3d8d/' extracted/voidmc_cf/wrangler.jsonc
          sed -i 's/"compatibility_date":[[:space:]]*"[^"]*"/"compatibility_date": "2025-10-01"/' extracted/voidmc_cf/wrangler.jsonc

      - name: Install dependencies
        working-directory: extracted/voidmc_cf
        run: npm install

      - name: Apply D1 migrations
        working-directory: extracted/voidmc_cf
        run: npx wrangler d1 migrations apply void-mc-store-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: extracted/voidmc_cf
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
